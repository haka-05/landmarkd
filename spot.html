<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Landmarkd</title>
<!-- Link previews (iMessage, Instagram...) read these without running any
     JavaScript, and this site is static, so every spot shares the same generic
     card. Per-spot previews would need a server-side page. -->
<meta property="og:title" content="A photo spot on Landmarkd">
<meta property="og:description" content="NYC's best photo spots, and what to wear to them.">
<meta property="og:image" content="https://landmarkd.co/og-image.png">
<meta property="og:site_name" content="Landmarkd">
<meta name="twitter:card" content="summary">
<meta name="theme-color" content="#0d0d0c">
<link rel="preload" href="assets/fonts/archivo-var.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="assets/site.css">
<link rel="icon" type="image/png" href="assets/pin-yellow.png">
<style>
  /* The site's dark theme (assets/site.css), with explicit colours rather than
     a light/dark media query, so in-app browsers (Instagram, Gmail) can't
     force a mismatched background. */
  main { width: min(560px, 100% - 2rem); margin: 0 auto; padding-top: 6.5rem; }
  .hero { width: 100%; aspect-ratio: 1; max-height: 60vh; object-fit: cover; display: block; background: var(--ink-3); border-radius: var(--radius); }
  .thumbs { display: flex; gap: 8px; padding-top: 8px; }
  .thumbs img { width: 33%; aspect-ratio: 1; object-fit: cover; border-radius: 14px; background: var(--ink-3); }
  .body { padding: 1.6rem 0 0; }
  h1 { font-size: clamp(2rem, 8vw, 2.8rem); margin-bottom: 0.6rem; }
  .rating { font-weight: 700; margin-bottom: 0.2rem; }
  .rating.unrated { color: var(--yellow); }
  .where { color: var(--muted); margin-bottom: 1rem; }
  .tags { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 1.1rem; }
  .tag { border: 1px solid var(--line); border-radius: 999px; padding: 3px 12px; font-size: .82rem; font-weight: 600; }
  .desc { margin: 0 0 1.8rem; white-space: pre-line; color: rgb(245 245 240 / 0.82); }
  .open { width: 100%; }
  .soon { text-align: center; color: var(--muted); font-size: .88rem; margin-top: .9rem; }
  .state { padding: 9rem 1.5rem 2rem; text-align: center; color: var(--muted); }
  .state h1 { color: var(--paper); }
  .hidden { display: none; }
</style>
</head>
<body>
<header class="nav">
  <a class="logo" href="/" aria-label="Landmarkd home"><img src="assets/wordmark-white.png" alt="Landmarkd" width="200" height="26"></a>
  <nav class="nav-links" aria-label="Main">
    <a class="hide-sm" href="/#how">How it works</a>
    <a class="btn btn-yellow" href="/#get">Get the app</a>
  </nav>
</header>

<div id="loading" class="state">Loading…</div>

<div id="missing" class="state hidden">
  <h1>Spot not found</h1>
  <p>This link may be wrong, or the spot was removed.</p>
</div>

<main id="spot" class="hidden">
  <img id="hero" class="hero hidden" alt="">
  <div id="thumbs" class="thumbs hidden"></div>
  <div class="body">
    <h1 id="title" class="display"></h1>
    <div id="rating" class="rating"></div>
    <div id="where" class="where"></div>
    <div id="tags" class="tags"></div>
    <p id="desc" class="desc"></p>
    <a id="open" class="btn btn-yellow open" href="#">Open in Landmarkd</a>
    <div class="soon">Coming soon to the App Store</div>
  </div>
</main>

<footer class="footer">
  <div class="wrap">
    <div>
      <a class="logo" href="/"><img src="assets/wordmark-white.png" alt="Landmarkd" width="200" height="26"></a>
      <p>&copy; 2026 Landmarkd</p>
    </div>
    <nav aria-label="Footer">
      <a href="privacy.html">Privacy Policy</a>
      <a href="terms.html">Terms of Service</a>
      <a href="mailto:support@landmarkd.co">support@landmarkd.co</a>
    </nav>
  </div>
</footer>

<script>
  // A spot shared from the app: landmarkd.co/spot?id=123. Public data only —
  // the spot's own photos (which are "no people" by design), title, rating,
  // tags, description and neighbourhood. No reviews or usernames, so nothing
  // about people leaves the app. Reads with the same public key as reset.html;
  // pins and reviews are publicly readable by policy.
  var SUPABASE_URL = 'https://qvmnthspckirkldfnvhs.supabase.co';
  var SUPABASE_ANON_KEY = 'sb_publishable_cI6-E6Qnx4NGlnegNndkaQ_Bvhq_Pos';

  function show(id) {
    ['loading', 'missing', 'spot'].forEach(function (v) {
      document.getElementById(v).classList.toggle('hidden', v !== id);
    });
  }

  // Everything below is user-written (titles, descriptions, tags), so it only
  // ever goes in via textContent — never innerHTML — or it could run script on
  // this domain. Photos must be https URLs from our own storage.
  function isOurPhoto(url) {
    return typeof url === 'string' && url.indexOf(SUPABASE_URL + '/storage/') === 0;
  }

  function get(path) {
    return fetch(SUPABASE_URL + '/rest/v1/' + path, { headers: { apikey: SUPABASE_ANON_KEY } })
      .then(function (r) { if (!r.ok) throw new Error(r.status); return r.json(); });
  }

  var id = new URLSearchParams(location.search).get('id');
  if (!/^\d+$/.test(id || '')) {
    show('missing');
  } else {
    Promise.all([
      get('pins?id=eq.' + id + '&select=id,title,description,tags,borough,neighborhoods,place_photos'),
      get('reviews?pin_id=eq.' + id + '&select=rating'),
    ]).then(function (res) {
      var pin = res[0][0];
      if (!pin) { show('missing'); return; }
      var ratings = res[1].map(function (r) { return r.rating; }).filter(function (r) { return typeof r === 'number'; });

      document.title = pin.title + ': Landmarkd';
      document.getElementById('title').textContent = pin.title;

      var rating = document.getElementById('rating');
      if (ratings.length) {
        var avg = ratings.reduce(function (a, b) { return a + b; }, 0) / ratings.length;
        rating.textContent = '★ ' + avg.toFixed(1) + ' · ' + ratings.length + (ratings.length === 1 ? ' review' : ' reviews');
      } else {
        rating.textContent = 'New · Unrated';
        rating.classList.add('unrated');
      }

      var hood = (pin.neighborhoods || [])[0];
      document.getElementById('where').textContent = [hood, pin.borough].filter(Boolean).join(', ');

      var tags = document.getElementById('tags');
      (pin.tags || []).forEach(function (t) {
        var el = document.createElement('span');
        el.className = 'tag';
        el.textContent = t;
        tags.appendChild(el);
      });

      document.getElementById('desc').textContent = pin.description || '';

      var photos = (pin.place_photos || []).filter(isOurPhoto);
      if (photos.length) {
        var hero = document.getElementById('hero');
        hero.src = photos[0];
        hero.alt = 'Photo of ' + pin.title;
        hero.classList.remove('hidden');
        var thumbs = document.getElementById('thumbs');
        photos.slice(1, 4).forEach(function (u) {
          var img = document.createElement('img');
          img.src = u;
          img.alt = '';
          img.loading = 'lazy';
          thumbs.appendChild(img);
        });
        if (photos.length > 1) thumbs.classList.remove('hidden');
      }

      // Opens the app straight to this spot if it's installed. iOS never hands a
      // link to the app from a page on the same domain, so this stays the custom scheme.
      document.getElementById('open').href = 'landmarkd://spot?id=' + pin.id;
      show('spot');
    }).catch(function () { show('missing'); });
  }
</script>
</body>
</html>
